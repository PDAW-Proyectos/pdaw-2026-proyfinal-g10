<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlquiYA! | Mi perfil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="profile-body">
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container py-2">
      <a class="navbar-brand fw-bold brand-text"id="inicio">
        <span class="brand-mark">A</span>lquiYA!
      </a>
      <div class="ms-auto d-flex align-items-center gap-2">
       <button class="btn btn-primary rounded-pill px-3" id="cerrarSesion">Cerrar sesion</button>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <section id="perfil" class="profile-header rounded-4 shadow-sm p-4 mb-4">
      </div>
      </div>
    </section>

       <section id="datos" class="row g-2 justify-content-center mb-4">

    </section>

    <section id="solicitudesAlquilerPropietario" class="card border-0 shadow-sm rounded-4 p-4 mb-4"
      aria-labelledby="solicitudesAlquilerTitulo" hidden>
      <h2 id="solicitudesAlquilerTitulo" class="h4 fw-bold mb-3">Solicitudes de alquiler</h2>
      <p id="mensajeSolicitudesAlquiler" class="text-secondary mb-3" role="status" aria-live="polite">
        Cargando solicitudes...
      </p>
      <div id="alquileresPropietario" class="row g-3"></div>
    </section>


 

    <section id="misAlquileresCliente" class="card border-0 shadow-sm rounded-4 p-4 mb-4"
      aria-labelledby="misAlquileresTitulo" hidden>
      <h2 id="misAlquileresTitulo" class="h4 fw-bold mb-3">Mis alquileres</h2>
      <p id="mensajeMisAlquileres" class="text-secondary mb-3" role="status" aria-live="polite">
        Cargando alquileres...
      </p>
      <div id="listaMisAlquileres" class="row g-3"></div>
    </section>
  </main>
  <script src="js/perfilPropietario.js"></script>
  <script src="js/perfilCliente.js"></script>
  <script type="module" src="js/perfil.js"></script>
</body>

</html>
