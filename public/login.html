<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlquiYA! | Iniciar sesión</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="auth-body">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container py-2">
        <a class="navbar-brand fw-bold brand-text" id="inicio">
          <span class="brand-mark">A</span>lquiYA!
        </a>
        <div class="ms-auto">
          <a class="btn btn-outline-primary rounded-pill px-3" href="index.html">Volver al inicio</a>
        </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-5">
          <div class="card border-0 shadow-sm rounded-4 auth-panel">
            <div class="card-body p-4 p-lg-5">
              <span class="badge rounded-pill badge-soft mb-3">Bienvenido</span>
              <h1 class="fw-bold mb-3">Iniciar sesión</h1>
              <p class="text-secondary mb-4">Ingresá con tu correo y contraseña para continuar.</p>

              <form id="loginForm" action="#" method="get">
                <div class="mb-3">
                  <label for="email" class="form-label fw-semibold">Correo electrónico</label>
                  <input type="email" class="form-control form-control-lg rounded-3" required name="correo" id="email" placeholder="tuemail@ejemplo.com" />
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label fw-semibold">Contraseña</label>
                  <input type="password" name="contrasena" class="form-control form-control-lg rounded-3" required id="password" placeholder="••••••••" />
                </div>


                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 mb-3">Ingresar</button>
              </form>

              <p class="text-center text-secondary mt-4 mb-0">
                ¿No tenés cuenta?
                <button
                  type="button"
                  class="btn btn-link text-primary text-decoration-none fw-semibold p-0 align-baseline"
                  data-bs-toggle="modal"
                  data-bs-target="#registerModal"
                >
                  Registrate
                </button>
              </p>
            <div class="error-div">
                  <div
                    id="errorSesion"
                    class="alert alert-danger mb-0 text-center"
                    role="alert"
                    hidden
                  ></div>
                </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
      <div class="modal-dialog  modal-lg">
        <div class="modal-content border-0 rounded-4 shadow-lg">
          <div class="modal-header border-0 pb-0">
            <div>
              <span class="badge rounded-pill text-bg-primary-subtle text-primary mb-2">Crear cuenta</span>
              <h2 class="modal-title fw-bold mb-0" id="registerModalLabel">Registrate en AlquiYA!</h2>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body p-4 p-lg-5">
            <form id="formRegistro">
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="nombre" class="form-label fw-semibold">Nombre</label>
                  <input type="text" class="form-control form-control-lg  rounded-3"required maxlength="30"   minlength="3" name="nombre" id="nombre" placeholder="Tu nombre" />
                </div>
                <div class="col-md-6">
                  <label for="apellido" class="form-label fw-semibold">Apellido</label>
                  <input type="text" class="form-control form-control-lg rounded-3" required maxlength="15"   minlength="3" required name="apellido" placeholder="Tu apellido" required />
                </div>
                <div class="col-md-6">
                  <label for="registro-email" class="form-label fw-semibold">Correo electrónico</label>
                  <input type="email" class="form-control form-control-lg rounded-3" required name="correo" id="registro-email" placeholder="tuemail@ejemplo.com" />
                </div>
                <div class="col-md-6">
                  <label for="telefono" class="form-label fw-semibold">Número de teléfono</label>
                  <input type="tel" class="form-control form-control-lg rounded-3"required  id="telefono" name="telefono" placeholder="291 1234567" />
                </div>
                <div class="col-md-6">
                  <label for="registro-password" class="form-label fw-semibold">Contraseña</label>
                  <input type="password" class="form-control form-control-lg rounded-3"  autocomplete="new-password"  required name="contrasena" id="registro-password" placeholder="••••••••" />
                </div>

                 <div class="col-md-6">
                  <label class="form-label fw-semibold" for="roles">Tipo de cuenta</label>
                    <select class="form-select form-select-lg mb-3" name="tipo" id="tipo" required>
                      <option value="" disabled selected>Seleccionar tipo de cuenta</option>||
                      <option value="Cliente">Cliente</option>
                      <option value="Propietario">Propietario</option>
                    </select>        
              </div>


              <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary btn-lg rounded-3">Crear cuenta</button>
                <button type="button" class="btn btn-outline-primary btn-lg rounded-3" data-bs-dismiss="modal">
                  Cancelar
                </button>
                  <div class="col-12 error-div">
                    <div
                      id="errorRegistro"
                      class="alert alert-danger mb-0 text-center"
                      role="alert"
                      hidden
                    ></div>
                  </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
      <pre id="salida" aria-live="polite"></pre>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/login.js"></script>
  </body>
</html>
