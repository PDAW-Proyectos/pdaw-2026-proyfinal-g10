<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlquiYA! | Vista cliente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="profile-body">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
      <div class="container py-2">
        <a class="navbar-brand fw-bold brand-text" id="inicio">
          <span class="brand-mark">A</span>lquiYA!
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
          <a class="btn btn-outline-primary rounded-pill px-3" href="perfil.html">Perfil</a>
         <button class="btn btn-primary rounded-pill px-3" id="cerrarSesion">Cerrar sesion</button>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <section class="profile-header rounded-4 shadow-sm p-4 mb-4">
        <div class="row align-items-center g-3">
          <div class="col-md-8">
            <span class="badge rounded-pill badge-soft mb-2">Cliente</span>
            <h1 class="fw-bold mb-2">Explorar publicaciones</h1>
            <p class="text-secondary mb-0">Filtrá por tipo, valoraciones y precio para encontrar la mejor opción.</p>
          </div>

        </div>
      </section>

      <section class="card border-0 shadow-sm rounded-4 p-3 mb-4">
        <div class="row g-3 align-items-end">
          <div class="col-md-6">
            <label for="filtroPrecioMaximo" class="form-label fw-semibold">Precio máximo</label>
            <input id="filtroPrecioMaximo" data-filtro-precio-maximo type="number" min="0" step="0.01"
              class="form-control rounded-3" placeholder="$" />
          </div>
          <div class="col-md-6">
            <label for="filtroOrden" class="form-label fw-semibold">Orden</label>
            <select id="filtroOrden" data-filtro-orden class="form-select rounded-3">
              <option value="" selected>Ninguno</option>
              <option value="menor-precio">Menor precio</option>
              <option value="mayor-precio">Mayor precio</option>
              <option value="mayor-calificacion">Mayor calificación</option>
              <option value="cantidad-valoraciones">Cantidad de valoraciones</option>
            </select>
          </div>
        </div>
      </section>

      <section id="publicaciones" data-vista="cliente">
      </section>
    </main>

    <div class="modal fade" id="detallePublicacion" tabindex="-1" aria-labelledby="detallePublicacionLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 rounded-4 overflow-hidden">
          <div class="modal-header border-0">
            <h2 class="modal-title fs-5 fw-bold" id="detallePublicacionLabel" data-publicacion-titulo></h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body pt-0">
            <div class="row g-3 align-items-stretch">
              <div class="col-lg-7">
                <img src="" class="img-fluid rounded-3 w-100 modal-photo" alt="" data-publicacion-imagen />
              </div>
              <div class="col-lg-5">
                <div class="modal-map-shell">
                  <iframe
                    id="mapaUbicacion"
                    title="Mapa de ubicación de la publicación"
                    class="modal-map-frame"
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"
                    src="about:blank"
                  ></iframe>
                </div>
              </div>
            </div>
            <div class="d-flex justify-content-between align-items-center my-3">
              <span class="badge rounded-pill bg-light text-primary" data-publicacion-ubicacion></span>
              <strong class="text-primary fs-5" data-publicacion-precio></strong>
            </div>
            <p class="text-secondary" data-publicacion-descripcion></p>
            <form id="formAlquiler" class="row g-3">
              <div class="col-md-6">
                <label for="fechaInicioAlquiler" class="form-label fw-semibold">Fecha de inicio</label>
                <input type="date" class="form-control" id="fechaInicioAlquiler" name="fechaInicio" required />
              </div>
              <div class="col-md-6">
                <label for="fechaFinAlquiler" class="form-label fw-semibold">Fecha de fin</label>
                <input type="date" class="form-control" id="fechaFinAlquiler" name="fechaFin" required />
              </div>
              <div class="col-12">
                <div id="mensajeAlquiler" class="alert mb-0" role="status" aria-live="polite" hidden></div>
              </div>
            </form>
            <div class="text-warning mt-3" data-publicacion-calificacion></div>
          </div>
          <div class="modal-footer border-0">
            <button type="submit" form="formAlquiler" id="botonAlquilar" class="btn btn-primary rounded-pill">Alquilar</button>
            <button type="button" class="btn btn-outline-secondary rounded-pill" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="reportarPublicacionModal" tabindex="-1" aria-labelledby="reportarPublicacionLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4">
          <form id="formReportarPublicacion">
            <div class="modal-header border-0">
              <div>
                <h2 class="modal-title fs-5 fw-bold" id="reportarPublicacionLabel">Reportar publicación</h2>
                <p class="text-secondary small mb-0" data-reporte-publicacion></p>
              </div>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body pt-0">
              <input type="hidden" name="publicacionId" />
              <div class="mb-3">
                <label for="motivoReporte" class="form-label fw-semibold">Motivo</label>
                <input type="text" class="form-control rounded-3" id="motivoReporte" name="motivo"
                  maxlength="120" required />
              </div>
              <div class="mb-3">
                <label for="descripcionReporte" class="form-label fw-semibold">Descripción (opcional)</label>
                <textarea class="form-control rounded-3" id="descripcionReporte" name="descripcion"
                  rows="3" maxlength="1000"></textarea>
              </div>
              <div id="mensajeReporte" class="alert mb-0" role="status" aria-live="polite" hidden></div>
            </div>
            <div class="modal-footer border-0 pt-0">
              <button type="submit" class="btn btn-primary rounded-pill" id="enviarReporte">Enviar reporte</button>
              <button type="button" class="btn btn-outline-secondary rounded-pill" data-bs-dismiss="modal">Cancelar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="js/vistasPublicaciones.js"></script>
    <script type="module" src="js/vistaCliente.js"></script>
    <script src="js/alquilar.js"></script>
  </body>
</html>
