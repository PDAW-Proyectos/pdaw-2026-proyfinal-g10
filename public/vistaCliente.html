<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlquiYA! | Vista cliente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="profile-body">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
      <div class="container py-2">
        <a class="navbar-brand fw-bold brand-text" href="index.html">
          <span class="brand-mark">A</span>lquiYA!
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
          <a class="btn btn-outline-primary rounded-pill px-3" href="index.html">Inicio</a>
          <a class="btn btn-outline-primary rounded-pill px-3" href="perfil.html">Perfil</a>
          <a class="btn btn-primary rounded-pill px-3" href="login.html">Salir</a>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <section class="profile-header rounded-4 shadow-sm p-4 mb-4">
        <div class="row align-items-center g-3">
          <div class="col-md-8">
            <span class="badge rounded-pill badge-soft mb-2">Cliente</span>
            <h1 class="fw-bold mb-2">Explorar publicaciones</h1>
            <p class="text-secondary mb-0">Filtrá por tipo, zona y precio para encontrar la mejor opción.</p>
          </div>
          <div class="col-md-4 text-md-end">
            <button type="button" class="btn btn-primary rounded-pill px-3">Aplicar filtros</button>
          </div>
        </div>
      </section>

      <section class="card border-0 shadow-sm rounded-4 p-3 mb-4">
        <div class="row g-3 align-items-end">
          <div class="col-md-3">
            <label class="form-label fw-semibold">Tipo</label>
            <select class="form-select rounded-3">
              <option selected>Todos</option>
              <option>Propiedad</option>
              <option>Habitación</option>
              <option>Vehículo</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Zona</label>
            <select class="form-select rounded-3">
              <option selected>Cualquier zona</option>
              <option>Centro</option>
              <option>Villa Mitre</option>
              <option>Barrio Norte</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Precio máximo</label>
            <select class="form-select rounded-3">
              <option selected>$ 1000</option>
              <option>$ 700</option>
              <option>$ 900</option>
              <option>$ 1200</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Orden</label>
            <select class="form-select rounded-3">
              <option selected>Más relevantes</option>
              <option>Menor precio</option>
              <option>Mayor precio</option>
            </select>
          </div>
        </div>
      </section>

      <section id="publicaciones" data-vista="cliente">
      </section>
    </main>

    <div class="modal fade" id="detallePublicacion" tabindex="-1" aria-labelledby="detallePublicacionLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 rounded-4 overflow-hidden">
          <div class="modal-header border-0">
            <h2 class="modal-title fs-5 fw-bold" id="detallePublicacionLabel" data-publicacion-titulo></h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body pt-0">
            <div class="row g-3 align-items-stretch">
              <div class="col-lg-7">
                <img src="" class="img-fluid rounded-3 w-100 modal-photo" alt="" data-publicacion-imagen />
              </div>
              <div class="col-lg-5">
                <div class="modal-map-shell">
                  <iframe
                    id="mapaUbicacion"
                    title="Mapa de ubicación de la publicación"
                    class="modal-map-frame"
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"
                    src="about:blank"
                  ></iframe>
                </div>
              </div>
            </div>
            <div class="d-flex justify-content-between align-items-center my-3">
              <span class="badge rounded-pill bg-light text-primary" data-publicacion-ubicacion></span>
              <strong class="text-primary fs-5" data-publicacion-precio></strong>
            </div>
            <p class="text-secondary" data-publicacion-descripcion></p>
            <div class="text-warning mt-3" data-publicacion-calificacion></div>
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-outline-secondary rounded-pill" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="js/vistasPublicaciones.js"></script>
    <script src="js/vistaCliente.js"></script>
  </body>
</html>
